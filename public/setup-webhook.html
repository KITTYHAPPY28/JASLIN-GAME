<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JASLIN • Telegram Webhook Setup</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#070707;color:#f4f4f4;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}
    .card{width:min(520px,100%);border:1px solid #2b2514;border-radius:20px;padding:24px;background:#0d0d0d;box-shadow:0 20px 60px #000}
    h1{margin:0 0 8px;font-size:25px}
    .gold{color:#e9bd45}
    p{color:#aaa;line-height:1.5;font-size:14px}
    label{display:block;margin:22px 0 8px;font-size:13px;color:#d8d8d8}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#050505;color:white;outline:none}
    button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;font-weight:800;font-size:15px;background:#e9bd45;color:#090909;cursor:pointer}
    button:disabled{opacity:.55}
    #result{margin-top:16px;padding:13px;border-radius:12px;background:#080808;border:1px solid #222;display:none;white-space:pre-wrap;word-break:break-word;font-size:13px}
    .note{margin-top:18px;font-size:12px;color:#777}
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="gold">JASLIN</span> Webhook Setup</h1>
    <p>Aktifkan Telegram webhook menggunakan admin key. BOT_TOKEN tetap berada di server dan tidak dimasukkan di halaman ini.</p>

    <label for="key">TREASURY_ADMIN_KEY</label>
    <input id="key" type="password" autocomplete="off" placeholder="Masukkan admin key dari Vercel">

    <button id="activate" type="button">⚡ Activate Telegram Webhook</button>
    <div id="result"></div>

    <div class="note">Setelah berhasil, hapus file setup-webhook.html dari folder public agar halaman setup tidak lagi tersedia.</div>
  </main>

<script>
const btn = document.getElementById("activate");
const key = document.getElementById("key");
const result = document.getElementById("result");

btn.addEventListener("click", async () => {
  const adminKey = key.value.trim();
  result.style.display = "block";

  if (!adminKey) {
    result.textContent = "❌ Masukkan TREASURY_ADMIN_KEY.";
    return;
  }

  btn.disabled = true;
  result.textContent = "Mengaktifkan webhook...";

  try {
    const response = await fetch("/api/setup-telegram-webhook", {
      method: "GET",
      headers: {
        "x-admin-key": adminKey
      },
      cache: "no-store"
    });

    let data;
    try { data = await response.json(); }
    catch { data = { ok:false, error:"Respons server bukan JSON." }; }

    if (response.ok && data.ok) {
      result.textContent =
        "✅ WEBHOOK ACTIVE\n\n" +
        (data.telegram?.description || "Telegram webhook berhasil diaktifkan.") +
        "\n\n" + (data.webhookUrl || "");
      key.value = "";
    } else {
      result.textContent =
        "❌ GAGAL\n\n" +
        (data.error || data.telegram?.description || ("HTTP " + response.status));
    }
  } catch (err) {
    result.textContent = "❌ GAGAL\n\n" + (err.message || String(err));
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
