<script>

const tg =
  window.Telegram.WebApp;

tg.ready();

tg.expand();


let state = null;

let busy = false;


/*
==================================================
ELEMENT HELPER
==================================================
*/

const $ =
  id =>
  document.getElementById(id);


/*
==================================================
API
==================================================
*/

async function api(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      endpoint,
      {

        ...options,

        headers: {

          "Content-Type":
            "application/json",

          "X-Telegram-Init-Data":
            tg.initData || "",

          ...(options.headers || {})
        }
      }
    );


  const data =
    await response
      .json()
      .catch(() => ({}));


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request gagal"
    );

  }


  return data;
}


/*
==================================================
STATUS
==================================================
*/

function showStatus(message) {

  $("status").textContent =
    message || "";

}


/*
==================================================
RENDER
==================================================
*/

function render(data) {

  state = data;


  $("username").textContent =
    data.user.firstName ||
    data.user.username ||
    "Player";


  $("avatar").textContent =
    (
      data.user.firstName ||
      "J"
    )
    .charAt(0)
    .toUpperCase();


  $("balance").textContent =
    Number(data.balance)
      .toFixed(4);


  $("mining").textContent =
    "+" +
    Number(data.mining)
      .toFixed(4);


  $("rate").textContent =
    Number(data.miningPerMinute)
      .toFixed(4) +
    "/min";


  $("spinBtn").disabled =
    !data.dailySpinAvailable;


  $("spinBtn").textContent =
    data.dailySpinAvailable
      ? "🎰 DAILY SPIN"
      : "⏳ SPIN BESOK";
}


/*
==================================================
INITIALIZE
==================================================
*/

async function init() {

  if (!tg.initData) {

    showStatus(
      "Buka game dari Telegram."
    );

    return;
  }


  try {

    const startParam =
      tg.initDataUnsafe
        ?.start_param || "";


    const data =
      await api(
        "/api/session",
        {

          method: "POST",

          body:
            JSON.stringify({
              startParam
            })

        }
      );


    render(data);

    showStatus(
      "JASLIN server connected."
    );

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

}


/*
==================================================
CLAIM
==================================================
*/

$("claimBtn").onclick =
async () => {

  if (busy) return;


  busy = true;

  $("claimBtn").disabled =
    true;

  $("claimBtn").textContent =
    "PROCESSING...";


  try {

    const data =
      await api(
        "/api/claim",
        {
          method: "POST",

          body: "{}"
        }
      );


    render(data);


    showStatus(
      `+${data.claimed} JASLIN berhasil di-claim.`
    );


    tg.HapticFeedback
      ?.notificationOccurred(
        "success"
      );

  }

  catch(error) {

    showStatus(
      error.message
    );

  }


  finally {

    busy = false;

    $("claimBtn").disabled =
      false;

    $("claimBtn").textContent =
      "⚡ CLAIM MINING";
  }

};


/*
==================================================
DAILY SPIN
==================================================
*/

$("spinBtn").onclick =
async () => {

  if (
    busy ||
    !state?.dailySpinAvailable
  ) return;


  busy = true;

  $("spinBtn").disabled =
    true;


  const degree =
    1440 +
    Math.floor(
      Math.random() * 360
    );


  $("wheel-disc")
    .style.transform =
    `rotate(${degree}deg)`;


  try {

    const data =
      await api(
        "/api/spin",
        {
          method: "POST",

          body: "{}"
        }
      );


    setTimeout(
      () => {

        render(data);

        showStatus(
          `🎉 +${data.reward} JASLIN dari Daily Spin!`
        );

        tg.HapticFeedback
          ?.notificationOccurred(
            "success"
          );

        busy = false;

      },
      4100
    );

  }

  catch(error) {

    $("wheel-disc")
      .style.transform =
      "rotate(0deg)";

    showStatus(
      error.message
    );

    busy = false;

    render(state);
  }

};


/*
==================================================
REFERRAL
==================================================
*/

function shareReferral() {

  if (!state) return;


  const text =
    encodeURIComponent(
      "Ayo main JASLIN Game dan kumpulkan JASLIN!"
    );


  const url =
    encodeURIComponent(
      state.referralLink
    );


  tg.openTelegramLink(
    `https://t.me/share/url?url=${url}&text=${text}`
  );
}


$("refBtn").onclick =
  shareReferral;


$("friendBtn").onclick =
  shareReferral;


/*
==================================================
WALLET
==================================================
*/

$("walletBtn").onclick =
async () => {

  const current =
    state?.user?.wallet || "";


  const wallet =
    prompt(
      "Masukkan alamat wallet Solana:",
      current
    );


  if (wallet === null)
    return;


  try {

    const result =
      await api(
        "/api/wallet",
        {

          method: "POST",

          body:
            JSON.stringify({
              wallet
            })

        }
      );


    if (state) {

      state.user.wallet =
        result.wallet;

    }


    showStatus(
      result.wallet
        ? "Wallet tersimpan."
        : "Wallet dihapus."
    );

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

};


/*
==================================================
BUY JASLIN
==================================================
*/

$("buyBtn").onclick =
() => {

  const mint =
    "YOUR_JASLIN_MINT_ADDRESS";


  if (
    mint ===
    "YOUR_JASLIN_MINT_ADDRESS"
  ) {

    showStatus(
      "Mint address JASLIN belum dipasang."
    );

    return;
  }


  tg.openLink(
    `https://jup.ag/swap/SOL-${mint}`
  );
};


/*
==================================================
TASK
==================================================
*/

$("taskBtn").onclick =
() => {

  showStatus(
    "Task system belum diaktifkan."
  );

};


/*
==================================================
AUTO REFRESH
==================================================
*/

setInterval(
  async () => {

    if (
      !tg.initData ||
      busy
    ) return;


    try {

      const data =
        await api(
          "/api/state"
        );


      render(data);

    }

    catch {}

  },
  10000
);


/*
==================================================
START
==================================================
*/

init();

</script>
